name: QA Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  selenium-tests:
    name: Selenium Functional Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install selenium pytest pytest-html webdriver-manager

      - name: Install Google Chrome
        run: |
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium Tests
        run: |
          mkdir -p reports
          pytest tests/selenium/test_automationexercise.py \
            --html=reports/selenium_report.html \
            --self-contained-html \
            -v --tb=short \
            2>&1 | tee reports/selenium_log.txt
        continue-on-error: true

      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-Test-Report
          path: |
            reports/selenium_report.html
            reports/selenium_log.txt
          retention-days: 30

  jmeter-tests:
    name: JMeter Performance Tests
    runs-on: ubuntu-latest
    needs: selenium-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download JMeter
        run: |
          wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter Load Test
        run: |
          mkdir -p reports/jmeter
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t Week4_AutomationExercise_LoadTest.jmx \
            -l reports/jmeter/results.jtl \
            -e -o reports/jmeter/html_report
        continue-on-error: true

      - name: Upload JMeter Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JMeter-Performance-Report
          path: reports/jmeter/
          retention-days: 30

  zap-security-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: selenium-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://automationexercise.com'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAP-Security-Report
          path: |
            report_html.html
            report_json.json
          retention-days: 30

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [selenium-tests, jmeter-tests, zap-security-scan]
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "========================================"
          echo "  QA PIPELINE - DevelopersHub Corp"
          echo "  Target: automationexercise.com"
          echo "  Completed at: $(date)"
          echo "========================================"
          echo "✅ Selenium Tests - Done"
          echo "✅ JMeter Load Test - Done"
          echo "✅ ZAP Security Scan - Done"
